
name: DHEERAJ HUB Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DHEERAJ_HUB_ANDROID_PROJECT.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          mkdir android-project
          unzip DHEERAJ_HUB_ANDROID_PROJECT.zip -d android-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHEERAJ-HUB-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          
