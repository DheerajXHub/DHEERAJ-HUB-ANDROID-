name: DHEERAJ HUB APP V13 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DHEERAJ_HUB_APP_V13_FINAL.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android V13 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract V13 Android project
        run: |
          test -f "DHEERAJ_HUB_APP_V13_FINAL.zip"
          mkdir -p android-project
          unzip -q "DHEERAJ_HUB_APP_V13_FINAL.zip" -d android-project
          test -f "android-project/settings.gradle"
          test -f "android-project/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          test -f "android-project/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p release
          cp "android-project/app/build/outputs/apk/debug/app-debug.apk" "release/DHEERAJ HUB.APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DHEERAJ-HUB-APP-V13
          path: "release/DHEERAJ HUB.APK"
          if-no-files-found: error
          retention-days: 30
          
